<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOSAT</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- GSAP & Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* WebGL Background Canvas */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Custom Interactive Cursor */
    .custom-cursor {
      width: 20px; height: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      position: fixed; pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
      backdrop-filter: blur(2px);
    }
    .custom-cursor.active {
      width: 60px; height: 60px;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Header Navigation */
    header {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 30px 50px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000;
      mix-blend-mode: difference;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 4px;
      cursor: pointer;
    }

    /* Inline Edit Trigger Icon in Admin Mode */
    .inline-edit-icon {
      display: none;
      color: #ffb703;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 6px;
      vertical-align: middle;
      transition: transform 0.2s;
    }
    .inline-edit-icon:hover { transform: scale(1.2); }
    body.admin-mode .inline-edit-icon { display: inline-block; }

    nav ul { display: flex; list-style: none; gap: 20px; align-items: center; }
    nav li { display: flex; align-items: center; }
    nav a {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      position: relative;
      padding-bottom: 5px;
      font-family: 'Syncopate', sans-serif;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0%; height: 2px;
      background: #fff;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav a:hover::after { width: 100%; }

    .admin-btn {
      background: #ffffff; color: #000; padding: 8px 18px; border-radius: 20px;
      font-weight: 700; cursor: pointer; transition: all 0.3s; border: none;
      font-family: 'Syncopate', sans-serif; font-size: 0.8rem;
    }
    .admin-btn:hover { background: #e0e0e0; transform: scale(1.05); }

    /* Site Title Edit Panel in Admin Mode */
    .site-settings-btn {
      display: none;
      background: #ffb703;
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Syncopate', sans-serif;
      font-size: 0.8rem;
      border: none;
      margin-right: 10px;
    }
    body.admin-mode .site-settings-btn { display: inline-block; }

    /* Hero Section */
    .hero {
      position: relative; width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      perspective: 1000px;
    }
    .hero-content {
      position: relative; z-index: 3; text-align: center; max-width: 1000px; padding: 0 20px;
      transform-style: preserve-3d;
    }
    .hero-subtitle-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
    .hero-subtitle {
      font-family: 'Syncopate', sans-serif; font-size: 0.95rem;
      letter-spacing: 8px; text-transform: uppercase; color: rgba(255, 255, 255, 0.6);
    }
    .hero-title-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
    .hero-title {
      font-family: 'Syncopate', sans-serif; font-size: 4.5rem;
      font-weight: 700; line-height: 1.05; letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 20px 40px rgba(0,0,0,0.8);
      white-space: pre-line;
    }

    /* Section & Cards */
    .section { padding: 120px 50px; position: relative; z-index: 3; perspective: 1200px; }
    .section-title-wrap {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px;
    }
    .section-title { font-family: 'Syncopate', sans-serif; font-size: 2.5rem; letter-spacing: 3px; }
    
    .add-post-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer;
      font-size: 0.85rem; display: none; align-items: center; gap: 8px; transition: 0.3s;
      font-family: 'Syncopate', sans-serif; backdrop-filter: blur(10px);
    }
    .add-post-btn:hover { background: #fff; color: #000; }
    body.admin-mode .add-post-btn { display: inline-flex; }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 60px;
    }

    .work-card-wrapper {
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .work-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      background-color: #121212;
      aspect-ratio: 16/9;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .work-card:hover {
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
    }

    .work-card img, .work-card video, .work-card iframe {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      filter: brightness(0.85);
      pointer-events: none;
    }

    .work-card-info {
      position: absolute; inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0) 100%);
      padding: 35px; display: flex; flex-direction: column; justify-content: flex-end;
      transform: translateZ(40px);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .work-card:hover img, .work-card:hover video {
      transform: scale(1.08) translateZ(10px);
      filter: brightness(1);
    }

    .work-category { font-family: 'Syncopate', sans-serif; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #ffb703; margin-bottom: 8px; }
    .work-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
    .work-desc { font-size: 0.95rem; color: #aaa; margin-bottom: 15px; }

    .card-admin-actions {
      display: none; gap: 10px; margin-top: 10px; z-index: 20;
      pointer-events: auto;
    }
    body.admin-mode .card-admin-actions { display: flex; }

    .action-btn {
      padding: 8px 14px; border-radius: 4px; font-size: 0.8rem; border: none; cursor: pointer; font-weight: bold;
    }
    .btn-edit { background: #ffb703; color: #000; }
    .btn-delete { background: #e63946; color: #fff; }

    /* DETAIL PAGE VIEW */
    #detailView {
      display: none;
      position: relative;
      z-index: 10;
      padding: 140px 50px 80px 50px;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .detail-nav-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
    }
    .back-btn {
      font-family: 'Syncopate', sans-serif; font-size: 0.85rem;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; padding: 12px 24px; border-radius: 30px; cursor: pointer;
      transition: all 0.3s; display: inline-flex; align-items: center; gap: 10px;
      backdrop-filter: blur(10px);
    }
    .back-btn:hover { background: #fff; color: #000; }

    .detail-admin-bar { display: none; gap: 12px; }
    body.admin-mode .detail-admin-bar { display: flex; }

    .detail-header { margin-bottom: 50px; }
    .detail-category { font-family: 'Syncopate', sans-serif; color: #ffb703; letter-spacing: 3px; margin-bottom: 12px; font-size: 1rem; }
    .detail-title { font-size: 3.5rem; font-weight: 700; margin-bottom: 20px; }
    .detail-meta { color: #ccc; font-size: 1.15rem; max-width: 850px; white-space: pre-line; line-height: 1.8; }

    .detail-media-container { display: flex; flex-direction: column; gap: 50px; margin-top: 50px; }
    .detail-media-wrapper {
      position: relative; width: 100%; border-radius: 12px; overflow: hidden;
      background: #121212; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      aspect-ratio: 16/9;
    }
    .detail-media-wrapper img, .detail-media-wrapper video, .detail-media-wrapper iframe {
      width: 100%; height: 100%; object-fit: contain; display: block; background: #000; border: none;
    }

    .media-item-actions {
      position: absolute; top: 20px; right: 20px; display: none; gap: 8px; z-index: 20;
    }
    body.admin-mode .media-item-actions { display: flex; }

    .media-action-btn {
      background: rgba(0,0,0,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .media-action-btn:hover { background: #ffb703; color: #000; }

    .detail-add-block {
      display: none; margin-top: 50px; padding: 40px; background: #121212;
      border: 1px dashed #444; border-radius: 12px; text-align: center;
    }
    body.admin-mode .detail-add-block { display: block; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px;
      backdrop-filter: blur(10px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #161616; border: 1px solid #333; width: 100%; max-width: 580px;
      padding: 40px; border-radius: 16px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-family: 'Syncopate', sans-serif; font-size: 1.5rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 8px; font-family: 'Syncopate', sans-serif; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px;
      color: #fff; font-size: 0.95rem; font-family: inherit;
    }
    .form-group textarea { resize: vertical; height: 100px; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
    .btn-cancel { background: transparent; border: 1px solid #555; color: #ccc; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: #fff; color: #000; border: none; padding: 10px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .cat-input-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .btn-delete-cat { background: #e63946; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; }

    .media-input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .media-input-row input { flex: 1; }
    .order-btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
    .order-btn:hover { background: #ffb703; color: #000; }
    .remove-media-row-btn { background: #e63946; color: #fff; border: none; padding: 10px 12px; border-radius: 6px; cursor: pointer; }

    /* Footer */
    footer { padding: 60px 50px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: #050505; }
    .social-links { display: flex; gap: 25px; font-size: 1.3rem; align-items: center; }

    @media (max-width: 768px) {
      header { padding: 20px; }
      .hero-title { font-size: 2.5rem; }
      .work-grid { grid-template-columns: 1fr; gap: 40px; }
      .section { padding: 80px 20px; }
      #detailView { padding: 100px 20px 60px 20px; }
      .detail-title { font-size: 2.2rem; }
      nav ul { gap: 15px; }
      footer { flex-direction: column; gap: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- 3D Three.js WebGL Particle Background -->
  <canvas id="webgl-canvas"></canvas>

  <div class="custom-cursor"></div>

  <header>
    <div class="logo-container">
      <div class="logo" id="siteLogoText" onclick="showMainView()">STUDIO.</div>
      <i class="fa-solid fa-pen-to-square inline-edit-icon" onclick="openSiteConfigModal()" title="Edit Logo Text"></i>
    </div>
    <nav>
      <ul id="navCategoryList">
        <!-- Dynamic Header Nav Links -->
      </ul>
    </nav>
  </header>

  <!-- 메인 리스트 뷰 -->
  <div id="mainView">
    <section class="hero">
      <div class="hero-content">
        <div class="hero-subtitle-wrap">
          <p class="hero-subtitle" id="siteHeroSubtitle">SL8IGHT VISUAL LAB</p>
          <i class="fa-solid fa-pen-to-square inline-edit-icon" onclick="openSiteConfigModal()" style="margin-left: 10px;"></i>
        </div>
        <div class="hero-title-wrap">
          <h1 class="hero-title" id="siteHeroTitle">CINEMATIC 3D<br>PORTFOLIO</h1>
          <i class="fa-solid fa-pen-to-square inline-edit-icon" onclick="openSiteConfigModal()" style="margin-left: 15px;"></i>
        </div>
      </div>
    </section>

    <main id="sectionsContainer">
      <!-- Dynamic Sections Container -->
    </main>
  </div>

  <!-- 세부 페이지 뷰 -->
  <div id="detailView">
    <div class="detail-nav-bar">
      <button class="back-btn" onclick="showMainView()"><i class="fa-solid fa-arrow-left"></i> BACK TO LIST</button>
      <div class="detail-admin-bar">
        <button class="action-btn btn-edit" onclick="editCurrentDetailWork()"><i class="fa-solid fa-pen-to-square"></i> EDIT THIS PAGE</button>
        <button class="action-btn btn-delete" onclick="deleteCurrentDetailWork()"><i class="fa-solid fa-trash"></i> DELETE WORK</button>
      </div>
    </div>

    <div class="detail-header">
      <div class="detail-category" id="detailCat">CATEGORY</div>
      <h1 class="detail-title" id="detailTitle">Work Title</h1>
      <p class="detail-meta" id="detailDesc">Work Description and credits will appear here.</p>
    </div>

    <div class="detail-media-container" id="detailMediaList"></div>

    <div class="detail-add-block">
      <h4 style="font-family:'Syncopate'; margin-bottom:15px;"><i class="fa-solid fa-plus-circle"></i> QUICK ADD MEDIA (IMAGE, VIDEO, YOUTUBE)</h4>
      <div style="display:flex; gap:10px; max-width:650px; margin:0 auto;">
        <input type="url" id="quickMediaUrl" placeholder="Paste Image/Video URL or YouTube Link (https://youtube.com/watch?v=...)" style="flex:1; padding:12px; background:#222; border:1px solid #444; color:#fff; border-radius:6px;">
        <button onclick="addQuickMedia()" style="padding:12px 24px; background:#fff; color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">ADD</button>
      </div>
    </div>
  </div>

  <!-- 사이트 설정 모달 -->
  <div class="modal-overlay" id="siteConfigModal">
    <div class="modal-box">
      <h3 class="modal-title">EDIT SITE CONFIG</h3>
      <form id="siteConfigForm" onsubmit="saveSiteConfig(event)">
        <div class="form-group">
          <label>LOGO TEXT (TOP-LEFT)</label>
          <input type="text" id="configLogoText" required>
        </div>
        <div class="form-group">
          <label>HERO SUBTITLE (MAIN TOP)</label>
          <input type="text" id="configHeroSubtitle" required>
        </div>
        <div class="form-group">
          <label>HERO MAIN TITLE (MAIN CENTER)</label>
          <textarea id="configHeroTitle" style="height:70px;" required></textarea>
        </div>
        
        <hr style="border:none; border-top:1px solid #333; margin:20px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h4 style="font-family:'Syncopate'; font-size:0.95rem; color:#ffb703;">CATEGORIES MANAGER</h4>
          <button type="button" onclick="addCategoryInputRow()" style="background:#222; border:1px solid #ffb703; color:#ffb703; padding:5px 12px; border-radius:4px; font-size:0.75rem; cursor:pointer; font-weight:bold;">
            <i class="fa-solid fa-plus"></i> ADD CATEGORY
          </button>
        </div>
        <div id="categoryInputsContainer"></div>

        <hr style="border:none; border-top:1px solid #333; margin:20px 0;">
        <h4 style="font-family:'Syncopate'; font-size:0.95rem; margin-bottom:15px; color:#ffb703;">FOOTER & SOCIAL LINKS</h4>
        <div class="form-group">
          <label>FOOTER COPYRIGHT TEXT</label>
          <input type="text" id="configFooterText" required>
        </div>
        <div class="form-group">
          <label>INSTAGRAM URL (Optional)</label>
          <input type="url" id="configSocialInstagram" placeholder="https://instagram.com/...">
        </div>
        <div class="form-group">
          <label>VIMEO URL (Optional)</label>
          <input type="url" id="configSocialVimeo" placeholder="https://vimeo.com/...">
        </div>
        <div class="form-group">
          <label>YOUTUBE URL (Optional)</label>
          <input type="url" id="configSocialYoutube" placeholder="https://youtube.com/...">
        </div>

        <div class="modal-btns">
          <button type="button" class="btn-cancel" onclick="closeSiteConfigModal()">CANCEL</button>
          <button type="submit" class="btn-save">SAVE CONFIG</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 관리자 모달 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box" style="max-width: 400px;">
      <h3 class="modal-title">ADMIN LOGIN</h3>
      <form id="authForm" onsubmit="verifyAdminCode(event)">
        <div class="form-group">
          <label>ENTER CODE</label>
          <input type="password" id="adminCodeInput" placeholder="Enter admin code" required autofocus>
        </div>
        <div class="modal-btns">
          <button type="button" class="btn-cancel" onclick="closeAuthModal()">CANCEL</button>
          <button type="submit" class="btn-save">LOGIN</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 포스트 편집 모달 -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-box">
      <h3 class="modal-title" id="modalHeaderTitle">ADD NEW WORK</h3>
      <form id="postForm">
        <input type="hidden" id="editPostId">
        <div class="form-group">
          <label>CATEGORY</label>
          <select id="postCategory" required></select>
        </div>
        <div class="form-group">
          <label>TITLE</label>
          <input type="text" id="postTitle" placeholder="Ex: ARTIST - 'NEON NIGHTS'" required>
        </div>
        <div class="form-group">
          <label>MAIN COVER TYPE</label>
          <select id="postMediaType">
            <option value="image">IMAGE (URL)</option>
            <option value="video">VIDEO (URL .mp4)</option>
            <option value="youtube">YOUTUBE (URL / Share Link)</option>
          </select>
        </div>
        <div class="form-group">
          <label>MAIN COVER URL</label>
          <input type="url" id="postMediaUrl" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>DESCRIPTION & CREDITS (TEXT)</label>
          <textarea id="postDesc" placeholder="Enter detailed concept, story, or project credits..."></textarea>
        </div>

        <div class="form-group">
          <label>ADDITIONAL MEDIA GALLERY (URL / YOUTUBE)</label>
          <div id="extraMediaContainer"></div>
          <button type="button" onclick="addExtraMediaField()" style="width:100%; padding:10px; background:#2a2a2a; border:1px dashed #555; color:#fff; border-radius:6px; cursor:pointer; margin-top:5px;">
            <i class="fa-solid fa-plus"></i> Add Another Media Field
          </button>
        </div>

        <div class="modal-btns">
          <button type="button" class="btn-cancel" onclick="closeModal()">CANCEL</button>
          <button type="submit" class="btn-save">SAVE</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div style="color:#666; font-size:0.9rem;" id="siteFooterText">&copy; 2026 STUDIO. All rights reserved.</div>
    <i class="fa-solid fa-pen-to-square inline-edit-icon" onclick="openSiteConfigModal()" title="Edit Footer"></i>
    <div class="social-links" id="siteSocialLinks"></div>
  </footer>

  <script>
    const CORRECT_CODE = "1031";
    let isAdmin = false;
    let currentDetailId = null;

    // -------------------------------------------------------------
    // 실시간 클라우드 DB 연동 레이어 (JSONBin.io API 기반)

    const CLOUD_API_KEY = "$2a$10$wE0p93jG.uI3GqHTh78MleE6s9K54D60l9b0A1hS0hCjF5O68u9yq"; // 무료 공개 API 키

        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': CLOUD_API_KEY }
        });
        if (response.ok) {
          const resJson = await response.json();
          if (resJson.record) {
            if (resJson.record.config) localStorage.setItem('site_config_v3_dynamic', JSON.stringify(resJson.record.config));
            if (resJson.record.works) localStorage.setItem('portfolio_works_3d_v1', JSON.stringify(resJson.record.works));

        }
      } catch (e) {
        console.warn('Cloud DB Load failed. Falling back to local/default data.', e);
      }
    }

          headers: {

            'X-Master-Key': CLOUD_API_KEY
          },
          body: JSON.stringify({ config, works })
        });
        if (response.ok) {

        }
      } catch (e) {
        console.error('Failed to sync to Cloud DB', e);
      }
    }

    // 유튜브 URL 파싱 함수
    function parseMediaUrl(url) {
      if (!url) return { type: 'image', src: '' };
      const trimmed = url.trim();

      const ytRegExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = trimmed.match(ytRegExp);

      if (match && match[2].length === 11) {
        return {
          type: 'youtube',
          src: `https://www.youtube.com/embed/${match[2]}?rel=0&enablejsapi=1`
        };
      } else if (trimmed.endsWith('.mp4') || trimmed.endsWith('.webm') || trimmed.includes('video/upload')) {
        return { type: 'video', src: trimmed };
      } else {
        return { type: 'image', src: trimmed };
      }
    }

    function renderWorks() {
      const works = getWorks();
      const config = getSiteConfig();

      config.categories.forEach(cat => {
        const grid = document.getElementById(`grid-${cat.id}`);
        if (!grid) return;
        grid.innerHTML = '';
        const catWorks = works.filter(w => w.category === cat.id);

        if (catWorks.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1; color:#555; text-align:center; padding:40px;">No works registered yet in this category.</div>`;
          return;
        }

        catWorks.forEach(work => {
          const wrapper = document.createElement('div');
          wrapper.className = 'work-card-wrapper';

          const card = document.createElement('div');
          card.className = 'work-card hover-target';
          card.onclick = (e) => {
            if (e.target.closest('.card-admin-actions')) return;
            openDetailPage(work.id);
          };

          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -12;
            const rotateY = ((x - centerX) / centerX) * 12;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
          });

          card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
          });

          const parsedMedia = parseMediaUrl(work.mediaUrl);
          let mediaHtml = '';
          if (work.type === 'youtube' || parsedMedia.type === 'youtube') {
            mediaHtml = `<iframe src="${parsedMedia.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
          } else if (work.type === 'video' || parsedMedia.type === 'video') {
            mediaHtml = `<video src="${parsedMedia.src}" autoplay loop muted playsinline></video>`;
          } else {
            mediaHtml = `<img src="${parsedMedia.src}" alt="${work.title}">`;
          }

          card.innerHTML = `
            ${mediaHtml}
            <div class="work-card-info">
              <span class="work-category">${cat.name}</span>
              <h3 class="work-title">${work.title}</h3>
              <p class="work-desc" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${work.desc || ''}</p>
              <div class="card-admin-actions">
                <button class="action-btn btn-edit" onclick="editPost('${work.id}', event)">EDIT</button>
                <button class="action-btn btn-delete" onclick="deletePost('${work.id}', event)">DELETE</button>
              </div>
            </div>
          `;
          wrapper.appendChild(card);
          grid.appendChild(wrapper);
        });
      });

      initScrollAnimations();
    }

    function initScrollAnimations() {
      gsap.registerPlugin(ScrollTrigger);

      gsap.utils.toArray('.section-title').forEach(title => {
        gsap.from(title, {
          scrollTrigger: { trigger: title, start: 'top 85%' },
          x: -80, opacity: 0, duration: 1.2, ease: 'power3.out'
        });
      });

      gsap.utils.toArray('.work-card-wrapper').forEach((card, i) => {
        gsap.from(card, {
          scrollTrigger: {
            trigger: card,
            start: 'top 88%',
            toggleActions: 'play none none reverse'
          },
          y: 100,
          rotateX: -25,
          scale: 0.85,
          opacity: 0,
          duration: 1.2,
          delay: (i % 2) * 0.15,
          ease: 'power3.out'
        });
      });
    }

    function openDetailPage(id) {
      currentDetailId = id;
      const works = getWorks();
      const config = getSiteConfig();
      const work = works.find(w => w.id === id);
      if (!work) return;

      const catObj = config.categories.find(c => c.id === work.category);
      const catName = catObj ? catObj.name : work.category.toUpperCase();

      document.getElementById('detailCat').innerText = catName;
      document.getElementById('detailTitle').innerText = work.title;
      document.getElementById('detailDesc').innerText = work.desc || '';

      renderDetailMediaList(work);

      document.getElementById('mainView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDetailMediaList(work) {
      const mediaContainer = document.getElementById('detailMediaList');
      mediaContainer.innerHTML = '';

      const fullList = [work.mediaUrl, ...(work.extraMedia || [])];

      fullList.forEach((url, index) => {
        if (!url.trim()) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'detail-media-wrapper';

        const parsed = parseMediaUrl(url);
        let mediaContent = '';

        if (parsed.type === 'youtube') {
          mediaContent = `<iframe src="${parsed.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else if (parsed.type === 'video') {
          mediaContent = `<video src="${parsed.src}" controls loop muted></video>`;
        } else {
          mediaContent = `<img src="${parsed.src}" alt="Detail Media">`;
        }

        wrapper.innerHTML = `
          ${mediaContent}
          <div class="media-item-actions">
            ${index === 0 ? '<span style="font-size:0.75rem; background:#ffb703; color:#000; font-weight:bold; padding:6px 10px; border-radius:4px;">MAIN COVER</span>' : ''}
            <button class="media-action-btn" onclick="moveDetailMediaItem(${index}, -1)" title="Move Up"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="media-action-btn" onclick="moveDetailMediaItem(${index}, 1)" title="Move Down"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="media-action-btn" style="background:#e63946;" onclick="removeDetailMediaItem(${index})" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        mediaContainer.appendChild(wrapper);
      });
    }

    function moveDetailMediaItem(index, direction) {
      let works = getWorks();
      const work = works.find(w => w.id === currentDetailId);
      if (!work) return;

      const list = [work.mediaUrl, ...(work.extraMedia || [])];
      const targetIndex = index + direction;

      if (targetIndex < 0 || targetIndex >= list.length) return;

      const temp = list[index];
      list[index] = list[targetIndex];
      list[targetIndex] = temp;

      work.mediaUrl = list[0];
      work.extraMedia = list.slice(1);

      saveWorks(works);
      openDetailPage(currentDetailId);
    }

    function removeDetailMediaItem(index) {
      if (!confirm('Are you sure you want to delete this media?')) return;
      let works = getWorks();
      const work = works.find(w => w.id === currentDetailId);
      if (!work) return;

      const list = [work.mediaUrl, ...(work.extraMedia || [])];
      list.splice(index, 1);

      if (list.length === 0) {
        alert('Work must have at least one media cover.');
        return;
      }

      work.mediaUrl = list[0];
      work.extraMedia = list.slice(1);

      saveWorks(works);
      openDetailPage(currentDetailId);
    }

    function addQuickMedia() {
      if (!currentDetailId) return;
      const urlInput = document.getElementById('quickMediaUrl');
      const url = urlInput.value.trim();
      if (!url) return;

      let works = getWorks();
      works = works.map(w => {
        if (w.id === currentDetailId) {
          if (!w.extraMedia) w.extraMedia = [];
          w.extraMedia.push(url);
        }
        return w;
      });

      saveWorks(works);
      urlInput.value = '';
      openDetailPage(currentDetailId);
    }

    function moveExtraMediaRow(button, direction) {
      const row = button.closest('.media-input-row');
      if (direction === -1 && row.previousElementSibling) {
        row.parentNode.insertBefore(row, row.previousElementSibling);
      } else if (direction === 1 && row.nextElementSibling) {
        row.parentNode.insertBefore(row.nextElementSibling, row);
      }

    document.getElementById('postForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isAdmin) return;
      
      const id = document.getElementById('editPostId').value;
      const category = document.getElementById('postCategory').value;
      const title = document.getElementById('postTitle').value;
      const type = document.getElementById('postMediaType').value;
      const mediaUrl = document.getElementById('postMediaUrl').value;
      const desc = document.getElementById('postDesc').value;
      
      const inputs = document.querySelectorAll('.extra-media-input');
      const extraMedia = [];
      inputs.forEach(input => {
        if (input.value.trim()) extraMedia.push(input.value.trim());
      });

      let works = getWorks();

      if (id) {
        works = works.map(w => w.id === id ? { id, category, title, type, mediaUrl, desc, extraMedia } : w);
      } else {
        const newWork = {
          id: Date.now().toString(),
          category, title, type, mediaUrl, desc, extraMedia
        };
        works.unshift(newWork);
      }

      saveWorks(works);
      closeModal();

      if (currentDetailId && currentDetailId === id) {
        openDetailPage(id);
      }
    });

    function editPost(id, e) {
      if (e) e.stopPropagation();
      if (!isAdmin) return;
      const works = getWorks();
      const work = works.find(w => w.id === id);
      if (!work) return;

      document.getElementById('modalHeaderTitle').innerText = 'EDIT WORK';
      document.getElementById('editPostId').value = work.id;
      document.getElementById('postCategory').value = work.category;
      document.getElementById('postTitle').value = work.title;
      document.getElementById('postMediaType').value = work.type || 'image';
      document.getElementById('postMediaUrl').value = work.mediaUrl;
      document.getElementById('postDesc').value = work.desc || '';

      const container = document.getElementById('extraMediaContainer');
      container.innerHTML = '';
      if (work.extraMedia && work.extraMedia.length > 0) {
        work.extraMedia.forEach(url => addExtraMediaField(url));
      } else {
        addExtraMediaField();
      }

      document.getElementById('postModal').classList.add('active');
    }

    function deletePost(id, e) {
      if (e) e.stopPropagation();
      if (!isAdmin) return;
      if (confirm('Are you sure you want to delete this work?')) {
        let works = getWorks();
        works = works.filter(w => w.id !== id);
        saveWorks(works);
        showMainView();
      }
    }

    // Custom Interactive Cursor
    const cursor = document.querySelector('.custom-cursor');
    window.addEventListener('mousemove', (e) => {
      gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.15, ease: 'power2.out' });
    });

    // THREE.JS 3D PARTICLE CANVAS SYSTEM
    function initThreeJS() {
      const canvas = document.getElementById('webgl-canvas');
      const scene = new THREE.Scene();
      
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 400;

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const particlesCount = 700;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particlesCount * 3);

      for (let i = 0; i < particlesCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 1200;
        positions[i + 1] = (Math.random() - 0.5) * 1200;
        positions[i + 2] = (Math.random() - 0.5) * 800;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 2.5,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
      });

      const particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
      });

      let scrollY = 0;
      window.addEventListener('scroll', () => {
        scrollY = window.scrollY;
      });

      function animate() {
        requestAnimationFrame(animate);

        particleSystem.rotation.y += 0.001;
        particleSystem.rotation.x += 0.0005;

        camera.position.x += (mouseX - camera.position.x) * 0.05;
        camera.position.y += (-mouseY - camera.position.y) * 0.05;
        camera.position.z = 400 + scrollY * 0.2;

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // App Initialization Pipeline (Cloud Data Sync -> Render)
    async function initApp() {
      await fetchCloudData();
      applySiteConfig();
      renderWorks();
      initThreeJS();
    }

    initApp();
  </script>
</body>
